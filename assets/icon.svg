<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2196F3" stroke="#1976D2" stroke-width="8"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="200" fill="#FFFFFF" stroke="#1976D2" stroke-width="4"/>

  <!-- Hour markers -->
  <line x1="256" y1="76" x2="256" y2="96" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="416" y2="256" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="416" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <line x1="76" y1="256" x2="96" y2="256" stroke="#333333" stroke-width="8" stroke-linecap="round"/>

  <!-- 45 degree markers -->
  <line x1="370" y1="142" x2="356" y2="156" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="370" x2="356" y2="356" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
  <line x1="142" y1="370" x2="156" y2="356" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
  <line x1="142" y1="142" x2="156" y2="156" stroke="#666666" stroke-width="6" stroke-linecap="round"/>

  <!-- Hour hand (pointing to 10) -->
  <line x1="256" y1="256" x2="196" y2="176" stroke="#333333" stroke-width="12" stroke-linecap="round"/>

  <!-- Minute hand (pointing to 2) -->
  <line x1="256" y1="256" x2="336" y2="196" stroke="#666666" stroke-width="8" stroke-linecap="round"/>

  <!-- Second hand (pointing to 6) -->
  <line x1="256" y1="256" x2="256" y2="376" stroke="#F44336" stroke-width="4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#F44336" stroke="#FFFFFF" stroke-width="2"/>
</svg>
